services:
  tell:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: tell
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"   # only host nginx is public
    env_file:
      - path: ../.env           # secrets stay server-side; needs Compose >= 2.24 for required: false
        required: false
    environment:
      THREATRANK_DATA_DIR: /app/data
      TELL_RESULTS_DIR: /app/results
      TELL_GRANITE_DIR: /app/outputs/granite
      TELL_DATA_LABEL: ${TELL_DATA_LABEL:-final}
    volumes:
      # new CSVs dropped here go live via hot reload, no rebuild
      - ../results:/app/results:ro
      - ../outputs:/app/outputs:ro
      - ../data:/app/data:ro

  # Old Streamlit dashboard: docker compose -f deploy/docker-compose.yml --profile streamlit up -d streamlit
  streamlit:
    profiles: ["streamlit"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile.streamlit
    container_name: tell-streamlit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../results:/app/results:ro
      - ../data:/app/data:ro
