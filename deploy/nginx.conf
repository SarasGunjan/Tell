# Tell web platform: nginx reverse proxy -> 127.0.0.1:8000 (certbot adds 443).
# setup_vultr.sh replaces server_name with $DOMAIN.

limit_req_zone $binary_remote_addr zone=tell_ai:10m  rate=10r/m;
limit_req_zone $binary_remote_addr zone=tell_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 64k;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # sha256 = inline theme script in web/index.html; recompute if that script changes.
    # style-src 'unsafe-inline': the app sets style attributes from JS.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-9qO35WyoQ2Naa30o+9uiD/H3E07ZORby30nr3m1RVoE='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # AI endpoints: strict limit
    location ~ ^/api/(chat|explain|brief|ask)$ {
        limit_req zone=tell_ai burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location /api/ {
        limit_req zone=tell_api burst=40;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    # Hashed Vite assets. add_header in a location drops inherited ones, so repeat them.
    location /assets/ {
        proxy_pass http://127.0.0.1:8000;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
